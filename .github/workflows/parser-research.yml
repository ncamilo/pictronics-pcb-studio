name: Parser research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  parser:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" gerbonara==1.6.3 numpy==2.2.6 shapely==2.1.2
      - run: python -c "import gerbonara, numpy, shapely"
      - run: python -m pytest tests/test_parser_research.py tests/test_parser_geometry.py tests/test_copper_composition.py tests/test_path_order.py tests/test_gerbonara_adapter.py tests/test_import_project.py tests/test_geometry_comparison.py tests/test_isolation_preview.py tests/test_isolation_coverage.py tests/test_multi_tool_preview.py tests/test_drilling_preview.py tests/test_cutout_preview.py tests/test_job_preview.py -v -s

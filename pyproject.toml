[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pictronics-pcb-studio"
version = "0.0.1"
description = "Modular open-source PCB milling workstation"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
ui = ["PySide6>=6.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
"pcb_studio.vendor.flatcam" = ["LICENSE", "PROVENANCE.md"]
